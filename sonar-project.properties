# SonarQube: local static analysis. Server: shared instance in ~/projects/sonarqube (Docker, not in CI).
# The token is not here: the scanner reads SONAR_TOKEN from the environment.

sonar.projectKey=invoice-extractor
sonar.projectName=Invoice Extractor
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
# generated: shadcn primitives and Supabase types
sonar.exclusions=.next/**,public/**,coverage/**,**/*.config.*,src/components/ui/**,src/lib/database.types.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage is measured on the pure logic in src/lib (validation, scoring); pages, components,
# routes, the proxy and the Supabase/Claude glue are checked end to end, not with bun test.
sonar.coverage.exclusions=src/app/**,src/components/**,src/proxy.ts,src/lib/extract.ts,src/lib/documents.ts,src/lib/supabase/**,src/lib/utils.ts
